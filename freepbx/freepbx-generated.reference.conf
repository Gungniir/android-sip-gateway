; ==== pjsip.endpoint.conf ====
[gw1rn9]
type=endpoint
transport=0.0.0.0-tls
context=from-gsm-gateway
disallow=all
allow=opus,alaw
aors=gw1rn9
send_connected_line=no
rtp_keepalive=0
language=ru
auth=gw1rn9
user_eq_phone=no
t38_udptl=no
t38_udptl_ec=none
fax_detect=no
trust_id_inbound=no
t38_udptl_nat=no
direct_media=no
rewrite_contact=yes
media_encryption=sdes
rtp_symmetric=yes
dtmf_mode=rfc4733

[gw2rn7]
type=endpoint
transport=0.0.0.0-tls
context=from-gsm-gateway
disallow=all
allow=opus,alaw
aors=gw2rn7
send_connected_line=no
rtp_keepalive=0
language=ru
auth=gw2rn7
user_eq_phone=no
t38_udptl=no
t38_udptl_ec=none
fax_detect=no
trust_id_inbound=no
t38_udptl_nat=no
direct_media=no
rewrite_contact=yes
media_encryption=sdes
rtp_symmetric=yes
dtmf_mode=rfc4733

; ==== pjsip.aor.conf ====
[gw1rn9]
type=aor
qualify_frequency=30
max_contacts=1

[gw2rn7]
type=aor
qualify_frequency=30
max_contacts=1

; ==== pjsip.auth.conf ====
[gw1rn9]
type=auth
auth_type=userpass
password=REDACTED
username=gw1rn9

[gw2rn7]
type=auth
auth_type=userpass
password=REDACTED
username=gw2rn7

; ==== pjsip.identify.conf ====
; ==== trunk dial strings (extensions_additional.conf [globals]) ====
OUT_1 = PJSIP
OUT_1_SUFFIX = @gw1rn9
OUT_2 = AMP:Local/1011*$OUTNUM$@gsm-out/n
OUT_3 = AMP:Local/1012*$OUTNUM$@gsm-out/n
OUT_4 = PJSIP
OUT_4_SUFFIX = @gw2rn7
OUT_5 = AMP:Local/1021*$OUTNUM$@gsm-out/n
OUT_6 = AMP:Local/1022*$OUTNUM$@gsm-out/n
; ==== outbound route order ====
include => outbound-allroutes-custom
include => outrt-1 ; GSM-SIM1-forced
include => outrt-2 ; GSM-SIM2-forced
include => outrt-4 ; GSM-SIM3-forced
include => outrt-5 ; GSM-SIM4-forced
include => outrt-3 ; GSM-default-2001
include => outrt-6 ; GSM-default-2002
; ==== outbound route dial patterns ====
; Forced SIM: prefix *0<gw><sim>, stripped before the trunk sees the number.
; Per-extension default: the /CID suffix is the CallerID column, and it is the
; row ODBC_GSMSMSSIM reads to decide which SIM that extension's SMS leaves on.
_*011+7XXXXXXXXXX      -> trunk 2  (1011, GW1SIM1)
_*0118XXXXXXXXXX       -> trunk 2
_*012+7XXXXXXXXXX      -> trunk 3  (1012, GW1SIM2)
_*0128XXXXXXXXXX       -> trunk 3
_*021+7XXXXXXXXXX      -> trunk 5  (1021, GW2SIM1)
_*0218XXXXXXXXXX       -> trunk 5
_*022+7XXXXXXXXXX      -> trunk 6  (1022, GW2SIM2)
_*0228XXXXXXXXXX       -> trunk 6
_+7XXXXXXXXXX/2001     -> trunk 2  (1011)
_8XXXXXXXXXX/2001      -> trunk 2
_+7XXXXXXXXXX/2002     -> trunk 5  (1021)
_8XXXXXXXXXX/2002      -> trunk 5
; ==== inbound route destinations (asterisk.incoming, via ODBC_GSMSMSDEST) ====
1011 -> 2001
1012 -> 2001
1021 -> 2001
1022 -> 2002
