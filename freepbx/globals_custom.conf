; ---- GSM<->SIP gateways -------------------------------------------------
; Maps a gateway id (the "10<gw>" prefix of a SIM DID) to its PJSIP endpoint.
; Adding a gateway = one line here. 1011/1012 -> gw1rn9, 1021/1022 -> gw2rn7.
;
; This is the one fact FreePBX does not hold: the Custom Trunk row that carries
; the DID ("Local/1021*$OUTNUM$@gsm-out/n") and the PJSIP Trunk row that carries
; the endpoint name are unrelated in its database, so nothing can be looked up.
GSMGW_101 = gw1rn9
GSMGW_102 = gw2rn7

; ---- SMS (SIP MESSAGE) --------------------------------------------------
; Domain the dialplan puts in the SIP URIs it builds for messages. It has to be
; the address the softphones register to, so that a reply to an SMS comes back
; here; the gateway app ignores it and only reads the user part.
GSMSMS_DOMAIN = 192.168.1.232

; Nothing else belongs here. Where an inbound SMS goes is the DID's Inbound
; Route, and which SIM an extension sends from is its Outbound Route - both are
; read straight out of FreePBX by func_odbc_custom.conf (ODBC_GSMSMSDEST,
; ODBC_GSMSMSSIM), so the GUI stays the only place either is configured.
