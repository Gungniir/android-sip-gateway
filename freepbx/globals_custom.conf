; ---- GSM<->SIP gateways -------------------------------------------------
; Maps a gateway id (the "10<gw>" prefix of a SIM DID) to its PJSIP endpoint.
; Adding a gateway = one line here. 1011/1012 -> gw1rn9, 1021/1022 -> gw2..., etc.
GSMGW_101 = gw1rn9
GSMGW_102 = gw2rn7

; ---- SMS (SIP MESSAGE) --------------------------------------------------
; Domain the dialplan puts in the SIP URIs it builds for messages. It has to be
; the address the softphones register to, so that a reply to an SMS comes back
; here; the gateway app ignores it and only reads the user part.
GSMSMS_DOMAIN = 192.168.1.232

; Inbound: which extension gets the SMS that arrived on a SIM's DID.
; FALLBACK ONLY - the DID's Inbound Route decides (ODBC_GSMSMSDEST in
; func_odbc_custom.conf), and these are used when it has no answer: no route for
; the DID, a route pointing at an IVR/ring group/queue, or a broken ODBC lookup.
; Editing these will not change routing while the Inbound Route still resolves.
; The DIDs must match the SIM destinations set in the app (Settings -> SIM1/SIM2).
GSMSMSTO_1011 = 2001
GSMSMSTO_1012 = 2001
GSMSMSTO_1021 = 2002
GSMSMSTO_1022 = 2002

; Outbound: default SIM DID for an extension's SMS. A *1/*2 prefix on the
; number overrides the SIM digit; the gateway comes from the DID either way.
GSMSMSDID_2001 = 1011
GSMSMSDID_2002 = 1021
