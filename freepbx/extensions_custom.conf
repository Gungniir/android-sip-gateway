;==============================================================================
; GSM <-> SIP gateways (Android gateway app)
;
; Inbound  (GSM -> SIP): each gateway trunk sets Context = from-gsm-gateway.
;   It only turns the app's X-GSM-CallerID header into a real CallerID, then
;   hands the call back to normal FreePBX inbound routing - DID -> destination
;   stays in the GUI (Inbound Routes). Adding a gateway changes nothing here.
;
; Outbound (SIP -> GSM): one Custom Trunk per SIM, dial string
;   Local/<did>*$OUTNUM$@gsm-out/n        e.g.  Local/1011*$OUTNUM$@gsm-out/n
;   DID plan is 10<gw><sim>: 1011 = gateway 1 / SIM 1, 1022 = gateway 2 / SIM 2.
;   Adding a gateway = one GSMGW_* line in globals_custom.conf, nothing here.
;
; A SIM is named to a human as GW<gw>SIM<sim> and addressed as *0<gw><sim>, both
; taken straight out of the DID - "*0" plus its last two digits. That prefix is
; what the forced-SIM Outbound Routes match, so a number the PBX hands a phone
; can be redialled and lands on the SIM it came from. The gateway's own SIM slot
; (X-GSM-SIM, 1 or 2) never leaves this file: the app knows nothing about which
; gateway it is.
;==============================================================================

[from-gsm-gateway]
; DIDs on the 10<gw><sim> plan also get a GW<gw>SIM<sim> label, so you can see
; which SIM of which gateway rang, and the *0<gw><sim> prefix on the number so
; that calling back from the phone's history leaves on the SIM that was called -
; a bare number would take the caller's default route and answer from the wrong
; SIM. Same trick as CONNECTEDLINE in [gsm-out] and MESSAGE(from) in
; [from-gsm-sms]; the display name keeps the number readable.
exten => _10[1-9][1-2],1,Gosub(gsm-set-cid,s,1())
 same => n,ExecIf($["${GSM_CALLER}" != ""]?Set(CALLERID(name)=GW${EXTEN:2:1}SIM${EXTEN:3:1} ${GSM_CALLER}))
 same => n,ExecIf($["${GSM_CALLER}" != ""]?Set(CALLERID(num)=*0${EXTEN:2:2}${GSM_CALLER}))
 same => n,Goto(from-pstn,${EXTEN},1)

; Any other DID from a gateway still gets its CallerID fixed up.
exten => _X.,1,Gosub(gsm-set-cid,s,1())
 same => n,Goto(from-pstn,${EXTEN},1)

[gsm-set-cid]
; X-GSM-CallerID -> CallerID. Leaves the call untouched when the header is absent.
exten => s,1,Set(GSM_CALLER=${PJSIP_HEADER(read,X-GSM-CallerID)})
 same => n,GotoIf($["${GSM_CALLER}" = ""]?done)
 same => n,Set(CALLERID(num)=${GSM_CALLER})
 same => n,Set(CALLERID(name)=${GSM_CALLER})
 same => n(done),Return()

[gsm-sim-header]
; Runs on the OUTBOUND channel via Dial's b() option - the only place
; PJSIP_HEADER(add,...) reaches the outgoing INVITE. ARG1 is the SIM slot.
exten => s,1,Set(PJSIP_HEADER(add,X-GSM-SIM)=${ARG1})
 same => n,Return()

[gsm-out]
; EXTEN arrives as <did>*<number>, e.g. 1011*+79991234567
exten => _10[1-9][1-2]*.,1,Set(GSMDID=${EXTEN:0:4})
 same => n,Set(GSMSIM=${GSMDID:3:1})
 same => n,Set(GSMNUM=${CUT(EXTEN,*,2)})
 same => n,Set(GSMEP=${GSMGW_${GSMDID:0:3}})
 same => n,GotoIf($["${GSMEP}" = ""]?nogw)
 same => n,NoOp(GSM out via ${GSMEP} GW${GSMDID:2:1}SIM${GSMSIM} -> ${GSMNUM})
 ; What the calling softphone shows: SIM label + number as the name, and a
 ; redial-able *0<gw><sim><number> as the number - the DID's own last two digits,
 ; so redial comes back to this gateway and not just to some SIM with that slot.
 ; I = ignore the callee's own updates.
 same => n,Set(CONNECTEDLINE(name,i)=GW${GSMDID:2:1}SIM${GSMSIM} ${GSMNUM})
 same => n,Set(CONNECTEDLINE(num)=*0${GSMDID:2:2}${GSMNUM})
 same => n,Dial(PJSIP/${GSMNUM}@${GSMEP},300,b(gsm-sim-header^s^1(${GSMSIM}))I)
 same => n,Hangup()
 same => n(nogw),NoOp(No GSMGW_${GSMDID:0:3} global - add it to globals_custom.conf)
 same => n,Congestion(5)
 same => n,Hangup()

;==============================================================================
; SMS (SIP MESSAGE) <-> GSM
;
; Same numbering as calls: a SIM's DID 10<gw><sim> is both the address the app
; sends SMS to and the label saying which SIM they arrived on.
;
;   GSM -> SIP  the app MESSAGEs sip:1011@pbx with X-GSM-CallerID: <sender>
;               [from-gsm-sms] -> the Inbound Route's extension
;   SIP -> GSM  a softphone MESSAGEs +7..., 8... or *011+7... (SIM prefix, as in
;               calls) -> [gsm-sms-out] -> the gateway endpoint, SIM in X-GSM-SIM
;
; Neither context is reachable without message_context= on the endpoint - see
; pjsip.endpoint_custom_post.conf. That setting is what a FreePBX upgrade loses.
;
; Nothing here is per-gateway or per-extension: both ends read the GUI through
; func_odbc_custom.conf, and the prefix carries the gateway with it.
;==============================================================================

[from-gsm-sms]
; message_context of a gateway endpoint. EXTEN is the SIM DID the app addressed.
exten => _10[1-9][1-2],1,NoOp(GSM SMS on DID ${EXTEN} from ${MESSAGE_DATA(X-GSM-CallerID)})
 same => n,Set(GSMSIM=${EXTEN:3:1})
 same => n,Set(GSMFROM=${MESSAGE_DATA(X-GSM-CallerID)})
 ; Where the SMS goes is the DID's Inbound Route, read out of FreePBX's own table
 ; so the GUI stays the one place it is configured. Nothing answers for a DID with
 ; no route, one pointing at something that cannot take an SMS (IVR, ring group,
 ; queue), or a lost func_odbc include - the message is dropped and logged.
 same => n,Set(SMSTO=${ODBC_GSMSMSDEST(${EXTEN})})
 same => n,NoOp(DID ${EXTEN} -> ${SMSTO})
 same => n,GotoIf($["${SMSTO}" = ""]?nodst)
 ; Sender: the readable number as the display name, *0<gw><sim><number> as the
 ; URI, so a reply leaves on the SIM the message came in on - the CONNECTEDLINE
 ; trick that [gsm-out] uses for calls. Left alone when the app sent no header.
 same => n,ExecIf($["${GSMFROM}" != ""]?Set(MESSAGE(from)="GW${EXTEN:2:1}SIM${GSMSIM} ${GSMFROM}" <sip:*0${EXTEN:2:2}${GSMFROM}@${GSMSMS_DOMAIN}>))
 same => n,Set(MESSAGE(to)=sip:${SMSTO}@${GSMSMS_DOMAIN})
 same => n,Gosub(gsm-sms-deliver,s,1(${SMSTO}))
 ; A failure here loses the SMS: the app has already marked it read on the phone.
 ; Never log ${MESSAGE(body)} - an unbalanced ")" in an SMS breaks app arg parsing.
 same => n,ExecIf($[${SMSDELIVERED} = 0]?NoOp(LOST SMS from ${GSMFROM} to ${SMSTO}))
 same => n,Hangup()
 same => n(nodst),NoOp(No SMS destination for ${EXTEN} - point its Inbound Route at an extension, and check func_odbc.conf still includes func_odbc_custom.conf)
 same => n,Hangup()

exten => _X.,1,NoOp(SMS from a gateway to unknown DID ${EXTEN} - dropped)
 same => n,Hangup()

[gsm-sms-out]
; message_context of the softphones. A *0<gw><sim> prefix picks the SIM, exactly
; like the outbound call prefixes; anything that is not a phone number is relayed
; as a plain SIP chat message (this is what the old [myMessages] context did).
exten => _*0[1-9][1-2]+X.,1,Gosub(gsm-sms-send,s,1(${EXTEN:2:2},${EXTEN:4}))
 same => n,Hangup()

exten => _*0[1-9][1-2]X.,1,Gosub(gsm-sms-send,s,1(${EXTEN:2:2},${EXTEN:4}))
 same => n,Hangup()

exten => _+X.,1,Gosub(gsm-sms-send,s,1(0,${EXTEN}))
 same => n,Hangup()

; 10 digits and up is a phone number; extensions here are shorter than that.
exten => _XXXXXXXXXX,1,Gosub(gsm-sms-send,s,1(0,${EXTEN}))
 same => n,Hangup()

exten => _XXXXXXXXXX.,1,Gosub(gsm-sms-send,s,1(0,${EXTEN}))
 same => n,Hangup()

exten => _X.,1,NoOp(Internal message ${MESSAGE(from)} -> ${EXTEN})
 same => n,Set(MESSAGE(to)=sip:${EXTEN}@${GSMSMS_DOMAIN})
 same => n,Gosub(gsm-sms-deliver,s,1(${EXTEN}))
 same => n,GotoIf($[${SMSDELIVERED} > 0]?done)
 same => n,Gosub(gsm-sms-bounce,s,1(${EXTEN},Message to ${EXTEN} was not delivered - they are offline.))
 same => n(done),Hangup()

[gsm-sms-deliver]
; Deliver a message to every device registered on an extension. ARG1 = extension,
; SMSDELIVERED comes back with the number of copies that were accepted.
;
; MessageSend(pjsip:<endpoint>) reaches ONE device: Asterisk resolves the AOR to a
; single contact, unlike Dial() which forks to all of them. With a desktop and a
; mobile both registered as 2001, only one of them ever saw an SMS. Addressing each
; contact URI explicitly is the only way to reach them all - and it is the one place
; the pjsip:<endpoint>/<uri> form is correct, because a contact URI *is* the device.
exten => s,1,Set(SMSDELIVERED=0)
 same => n,Set(SMSCONTACTS=${PJSIP_AOR(${ARG1},contact)})
 same => n,Set(SMSTRY=0)
 same => n(next),GotoIf($["${SMSCONTACTS}" = ""]?done)
 ; Bounded in case SHIFT ever stops consuming the list - a spinning message
 ; channel would be a lot worse than a dropped SMS. 10 = the AOR's max_contacts.
 same => n,Set(SMSTRY=$[${SMSTRY} + 1])
 same => n,GotoIf($[${SMSTRY} > 10]?done)
 same => n,Set(SMSCURI=${PJSIP_CONTACT(${SHIFT(SMSCONTACTS)},uri)})
 same => n,GotoIf($["${SMSCURI}" = ""]?next)
 same => n,MessageSend(pjsip:${ARG1}/${SMSCURI})
 same => n,NoOp(SMS to ${ARG1} at ${SMSCURI}: ${MESSAGE_SEND_STATUS})
 same => n,ExecIf($["${MESSAGE_SEND_STATUS}" = "SUCCESS"]?Set(SMSDELIVERED=$[${SMSDELIVERED} + 1]))
 same => n,Goto(next)
 same => n(done),NoOp(Delivered to ${ARG1}: ${SMSDELIVERED} devices)
 same => n,Return()

[gsm-sms-send]
; ARG1 = <gw><sim> from a *0<gw><sim> prefix, or 0 for the sender's default.
; ARG2 = GSM number. No fan-out here: a gateway AOR holds one contact, and a
; second copy of an SMS would be a second SMS on the GSM network.
;
; Without a prefix the SIM is the one the sender's Outbound Route calls from, so
; an extension's SMS and its calls always leave on the same SIM. The prefix is
; the DID's own last two digits, so it replaces the whole DID - gateway included,
; which is why it cannot just override the slot the way *1/*2 used to.
exten => s,1,Set(SMSFROMEXT=${CUT(CUT(MESSAGE(from),@,1),:,2)})
 same => n,Set(SMSDID=${ODBC_GSMSMSSIM(${SMSFROMEXT})})
 same => n,ExecIf($["${ARG1}" != "0"]?Set(SMSDID=10${ARG1}))
 same => n,GotoIf($["${SMSDID}" = ""]?nodid)
 same => n,Set(GSMEP=${GSMGW_${SMSDID:0:3}})
 same => n,GotoIf($["${GSMEP}" = ""]?nogw)
 same => n,Set(GSMSIM=${SMSDID:3:1})
 same => n,NoOp(SMS out via ${GSMEP} GW${SMSDID:2:1}SIM${GSMSIM} -> ${ARG2})
 ; MESSAGE_DATA becomes a header on the outgoing MESSAGE; the app reads
 ; X-GSM-SIM in SipHeaderReader and sends on that SIM.
 same => n,Set(MESSAGE_DATA(X-GSM-SIM)=${GSMSIM})
 ; Routing follows the endpoint's registered contact; MESSAGE(to) only rewrites
 ; the To header, which is the one place the app looks for the GSM number.
 same => n,Set(MESSAGE(to)=sip:${ARG2}@${GSMSMS_DOMAIN})
 same => n,MessageSend(pjsip:${GSMEP})
 same => n,NoOp(Gateway ${GSMEP} accepted SMS to ${ARG2}: ${MESSAGE_SEND_STATUS})
 ; SUCCESS means the phone took it, not that the GSM network delivered it.
 same => n,GotoIf($["${MESSAGE_SEND_STATUS}" = "SUCCESS"]?done)
 same => n,Gosub(gsm-sms-bounce,s,1(${ARG2},SMS to ${ARG2} was not sent - the gateway is unreachable.))
 same => n(done),Return()
 same => n(nodid),NoOp(No SIM for ${SMSFROMEXT} - give it an Outbound Route whose CallerID column is ${SMSFROMEXT} and whose trunk is a GSM SIM)
 same => n,Gosub(gsm-sms-bounce,s,1(${ARG2},SMS not sent - extension ${SMSFROMEXT} has no GSM SIM assigned.))
 same => n,Return()
 same => n(nogw),NoOp(No GSMGW_${SMSDID:0:3} global for DID ${SMSDID})
 same => n,Gosub(gsm-sms-bounce,s,1(${ARG2},SMS not sent - gateway ${SMSDID:0:3} is not configured.))
 same => n,Return()

[gsm-sms-bounce]
; Tell the sender their message went nowhere. ARG1 is who the notice appears to
; come from, so it lands in the conversation it belongs to; ARG2 is the text
; (no commas or parentheses - Gosub splits on those). Read MESSAGE(from) before
; overwriting it: that is still the original sender at this point.
exten => s,1,Set(BOUNCETO=${CUT(CUT(MESSAGE(from),@,1),:,2)})
 same => n,GotoIf($["${BOUNCETO}" = ""]?done)
 same => n,Set(MESSAGE(body)=[${STRFTIME(${EPOCH},,%H:%M)}] ${ARG2})
 same => n,Set(MESSAGE(from)="SMS gateway" <sip:${ARG1}@${GSMSMS_DOMAIN}>)
 same => n,Set(MESSAGE(to)=sip:${BOUNCETO}@${GSMSMS_DOMAIN})
 same => n,Gosub(gsm-sms-deliver,s,1(${BOUNCETO}))
 same => n(done),Return()
