;==============================================================================
; Endpoint overrides - live path /etc/asterisk/pjsip.endpoint_custom_post.conf
;
; pjsip.conf includes this file straight after the generated pjsip.endpoint.conf,
; so [name](+) appends to an endpoint FreePBX built instead of replacing it.
;
; message_context is the only reason this file exists: it decides where a SIP
; MESSAGE (SMS) lands in the dialplan, and FreePBX has no GUI field for it.
; Without it a MESSAGE follows the endpoint's call context, which drops it.
;
; An upgrade emptied this file once already - if SMS stops working, check that
; it still has content before looking anywhere else.
;
; Adding an extension that should send SMS = one [ext](+) block here.
;
; WARNING: (+) on a name that no longer exists aborts the whole pjsip.conf load,
; not just this file - every endpoint disappears. Delete an extension or a trunk
; in the GUI, delete its block here in the same breath.
;==============================================================================

; --- softphones: SMS they send leave through the GSM gateway ---
[2001](+)
message_context=gsm-sms-out
[2002](+)
message_context=gsm-sms-out

; --- gateways: SMS the app forwards from GSM ---
[gw1rn9](+)
message_context=from-gsm-sms
[gw2rn7](+)
message_context=from-gsm-sms
