;==============================================================================
; func_odbc lookups - live path /etc/asterisk/func_odbc_custom.conf
;
; func_odbc only reads func_odbc.conf, so that file needs one line appended:
;
;     #include func_odbc_custom.conf
;
; func_odbc.conf belongs to the asterisk package, not to FreePBX, so an upgrade
; can replace it and take the include with it. Losing it stops SMS dead in both
; directions - these two lookups are the only thing that says where an SMS goes
; and which SIM it leaves on. If SMS breaks after an upgrade, check the include
; before anything else; both contexts log a "no destination"/"no SIM" NoOp.
;==============================================================================

; ODBC_GSMSMSDEST(<did>) - the extension an Inbound Route points that DID at, so
; SMS follows the route configured in the GUI instead of a parallel map.
;
; A route destination is stored as a Goto triple, "from-did-direct,2001,1"; the
; nested SUBSTRING_INDEX pulls the middle field out. Only routes that land on a
; real extension are usable - an IVR, ring group or queue cannot take an SMS - so
; the LIKE narrows it to those, and the HAVING drops anything that is not a plain
; number (voicemail is ext-local,vmu2001,1 and must not match). cidnum='' is the
; any-caller route; a CID-specific route is a call rule, not an SMS one.
;
; asteriskcdrdb is the only ODBC handle FreePBX configures, hence the explicit
; asterisk. schema prefix - freepbxuser reads both databases.
[GSMSMSDEST]
dsn=asteriskcdrdb
readsql=SELECT SUBSTRING_INDEX(SUBSTRING_INDEX(destination,',',2),',',-1) AS ext FROM asterisk.incoming WHERE extension='${SQL_ESC(${ARG1})}' AND (cidnum='' OR cidnum IS NULL) AND (destination LIKE 'from-did-direct,%' OR destination LIKE 'ext-local,%') HAVING ext REGEXP '^[0-9]+$' LIMIT 1

; ODBC_GSMSMSSIM(<ext>) - the SIM DID an extension sends from when it does not
; prefix the number, read out of its own Outbound Route so calls and SMS cannot
; drift apart. The route is the one whose CallerID column is the extension:
; match_cid is that column, and a pattern with no CID is a forced-SIM route
; (*0<gw><sim>), which must not answer here.
;
; route -> first trunk by seq -> the trunk's dial string. Custom trunks keep it
; in trunks.channelid, "Local/1011*$OUTNUM$@gsm-out/n" - FreePBX publishes the
; same string as OUT_<trunkid> with an "AMP:" prefix. Everything before the "*"
; ends with the DID, so the last four characters of it are the DID; the LIKE
; keeps other custom trunks out and the HAVING rejects anything off the plan.
[GSMSMSSIM]
dsn=asteriskcdrdb
readsql=SELECT RIGHT(SUBSTRING_INDEX(t.channelid,'*',1),4) AS did FROM asterisk.outbound_route_patterns p JOIN asterisk.outbound_route_trunks rt ON rt.route_id=p.route_id JOIN asterisk.trunks t ON t.trunkid=rt.trunk_id WHERE p.match_cid='${SQL_ESC(${ARG1})}' AND t.tech='custom' AND (t.disabled IS NULL OR t.disabled!='on') AND t.channelid LIKE 'Local/10%@gsm-out%' HAVING did REGEXP '^10[1-9][1-2]$' ORDER BY rt.seq LIMIT 1
