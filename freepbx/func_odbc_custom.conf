;==============================================================================
; func_odbc lookups - live path /etc/asterisk/func_odbc_custom.conf
;
; func_odbc only reads func_odbc.conf, so that file needs one line appended:
;
;     #include func_odbc_custom.conf
;
; func_odbc.conf belongs to the asterisk package, not to FreePBX, so an upgrade
; can replace it and take the include with it. That is survivable by design:
; ODBC_GSMSMSDEST then returns nothing and [from-gsm-sms] falls back to the
; GSMSMSTO_* globals - SMS keeps working, it just stops following the GUI.
;==============================================================================

; ODBC_GSMSMSDEST(<did>) - the extension an Inbound Route points that DID at, so
; SMS follows the route configured in the GUI instead of a parallel map.
;
; A route destination is stored as a Goto triple, "from-did-direct,2001,1"; the
; nested SUBSTRING_INDEX pulls the middle field out. Only routes that land on a
; real extension are usable - an IVR, ring group or queue cannot take an SMS - so
; the LIKE narrows it to those, and the HAVING drops anything that is not a plain
; number (voicemail is ext-local,vmu2001,1 and must not match). cidnum='' is the
; any-caller route; a CID-specific route is a call rule, not an SMS one.
;
; asteriskcdrdb is the only ODBC handle FreePBX configures, hence the explicit
; asterisk. schema prefix - freepbxuser reads both databases.
[GSMSMSDEST]
dsn=asteriskcdrdb
readsql=SELECT SUBSTRING_INDEX(SUBSTRING_INDEX(destination,',',2),',',-1) AS ext FROM asterisk.incoming WHERE extension='${SQL_ESC(${ARG1})}' AND (cidnum='' OR cidnum IS NULL) AND (destination LIKE 'from-did-direct,%' OR destination LIKE 'ext-local,%') HAVING ext REGEXP '^[0-9]+$' LIMIT 1
