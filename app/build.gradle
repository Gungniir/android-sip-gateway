apply plugin: 'com.android.application'

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "org.onetwoone.gateway"
    compileSdkVersion 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "org.onetwoone.gateway"
        minSdkVersion 23
        targetSdkVersion 27
        versionCode 4
        versionName "1.3"

        // NDK build config
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Lint: run with ./gradlew lintDebug; release builds are not gated (not for Google Play).
    // Pre-existing issues are captured in lint-baseline.xml — only new issues fail the build.
    lint {
        checkReleaseBuilds false
        abortOnError true
        baseline file('lint-baseline.xml')
    }

    // jniLibs for PJSIP native libraries
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // ABI filtering done via ndk.abiFilters in defaultConfig

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    // Robolectric needs the MERGED resource table and manifest to resolve R.string /
    // R.style / R.color. Without this AGP does not emit
    // com/android/tools/test_config.properties and every app resource lookup in a unit test
    // throws Resources$NotFoundException. GW-40 needs it for the theme-resolution tests.
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Material Components (GW-40). Provides the DayNight theme the design system is built
    // on, and the MaterialComponentsViewInflater that upgrades the layout's stock Button /
    // CheckBox / RadioButton / TextView in place.
    //
    // 1.13.0 is the CEILING, not a preference: 1.14.0 pulls androidx.core 1.16.0, whose AAR
    // metadata declares "requires Android Gradle plugin 8.6.0 or higher" and this build is
    // on AGP 8.2.0. Raising it means raising AGP, which is not a UI change. Lint will
    // therefore keep reporting "a newer version of material than 1.13.0 is available"; that
    // warning is expected and does not gate the build.
    //
    // None of this touches targetSdkVersion, which stays 27.
    implementation 'com.google.android.material:material:1.13.0'

    // Lifecycle & ViewModel for MVVM
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.activity:activity:1.8.0'

    // WorkManager for battery watchdog (runs even if service dies)
    implementation 'androidx.work:work-runtime:2.7.1'

    // NanoHTTPD for embedded web config server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'androidx.test:core:1.5.0'
}
