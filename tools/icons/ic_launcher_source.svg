<?xml version="1.0" encoding="utf-8"?>
<!--
  GW-44 - raster source for the legacy launcher icons (API 23-25).

  This is a hand-kept mirror of the two adaptive layers:
    app/src/main/res/drawable/ic_launcher_background.xml
    app/src/main/res/drawable/ic_launcher_foreground.xml

  The path data is byte-identical to those files (SVG and VectorDrawable share the syntax);
  only the colour references differ, since SVG cannot read @color/*. The literals below are
  values/colors.xml's ic_launcher_background (#FF0A5FC2) and ic_launcher_foreground
  (#FFFFFFFF) with the alpha byte dropped.

  EDIT ALL THREE TOGETHER, then re-run tools/icons/generate_launcher_png.py. Nothing checks
  that they agree - the adaptive icon and the legacy rasters are loaded by disjoint sets of
  Android versions, so a drift here shows up only on API 23-25 devices.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <path fill="#0A5FC2" d="M0,0h108v108h-108z"/>

  <!-- Mast tip. -->
  <path fill="#FFFFFF" d="M54,36a5.5,5.5 0 1 1 0,11a5.5,5.5 0 1 1 0,-11z"/>
  <!-- Mast column. -->
  <path fill="#FFFFFF" d="M51.2,45.5h5.6v26.5h-5.6z"/>
  <!-- Base plate. -->
  <path fill="#FFFFFF" d="M45.5,71h17a2.5,2.5 0 0 1 2.5,2.5v2a2.5,2.5 0 0 1 -2.5,2.5h-17a2.5,2.5 0 0 1 -2.5,-2.5v-2a2.5,2.5 0 0 1 2.5,-2.5z"/>

  <!-- Radiated arcs, centred on the mast tip (54, 41.5): r=13 inner, r=20.5 outer. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <path d="M42.124,46.787a13,13 0 0 1 0,-10.574"/>
    <path d="M35.273,49.837a20.5,20.5 0 0 1 0,-16.674"/>
    <path d="M65.876,46.787a13,13 0 0 0 0,-10.574"/>
    <path d="M72.727,49.837a20.5,20.5 0 0 0 0,-16.674"/>
  </g>
</svg>
